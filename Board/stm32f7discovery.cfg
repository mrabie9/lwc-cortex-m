# This is an STM32F7 discovery board with a single STM32F756NGH6 chip.
# http://www.st.com/web/catalog/tools/FM116/SC959/SS1532/LN1848/PF261641

# This is for using the onboard STLINK/V2-1
source [find interface/stlink.cfg]

# SWD transport. Its name differs between OpenOCD versions:
#   newer (>= 0.12+dev, "st-link" driver) : swd
#   0.12.0 release ("st-link" driver)     : dapdirect_swd
#   older ("hla" driver)                  : hla_swd
if {[catch {transport select swd}]} {
	if {[catch {transport select dapdirect_swd}]} {
		transport select hla_swd
	}
}

# increase working area to 256KB
set WORKAREASIZE 0x40000

source [find target/stm32f7x.cfg]

reset_config srst_only
